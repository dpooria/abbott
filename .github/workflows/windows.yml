name: Windows portable

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Odin
        shell: pwsh
        run: |
          $release = Invoke-RestMethod https://api.github.com/repos/odin-lang/Odin/releases/latest
          $asset = $release.assets | Where-Object { $_.name -match 'windows[-_]amd64.*\.zip$' } | Select-Object -First 1
          if (!$asset) { throw 'Could not find the Odin Windows download.' }
          Invoke-WebRequest $asset.browser_download_url -OutFile "$env:RUNNER_TEMP/odin.zip"
          Expand-Archive "$env:RUNNER_TEMP/odin.zip" "$env:RUNNER_TEMP/odin"
          $compiler = Get-ChildItem "$env:RUNNER_TEMP/odin" -Filter odin.exe -Recurse | Select-Object -First 1
          if (!$compiler) { throw 'Odin compiler missing.' }
          $compiler.DirectoryName | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build portable ZIP
        shell: pwsh
        run: ./build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: abbott-windows-x64
          path: dist/abbott-windows-x64.zip
          if-no-files-found: error
